
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCIENTIA — Fragment I</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #090d14;
      color: #e5e0d5;
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 650px; text-align: center; }
    .brand {
      color: #b7a477;
      letter-spacing: 5px;
      font-size: 12px;
    }
    .line {
      width: 65px;
      height: 1px;
      background: #8f7a4e;
      margin: 22px auto;
    }
    h1 { font-weight: normal; font-size: clamp(28px, 7vw, 42px); }
    .intro { color: #a7afbb; line-height: 1.8; }
    .clue {
      margin: 28px 0;
      padding: 12px;
      border: 1px solid #303744;
      background: #101722;
    }
    .clue img { display: block; width: 100%; height: auto; }
    #placeholder {
      display: none;
      color: #929dad;
      padding: 48px 12px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    input, button {
      width: 100%;
      max-width: 360px;
      padding: 14px;
      margin-top: 12px;
      font: inherit;
    }
    input {
      background: #101722;
      border: 1px solid #414958;
      color: white;
      text-align: center;
    }
    button {
      background: #b7a477;
      color: #090d14;
      border: 0;
      cursor: pointer;
    }
    #message { min-height: 24px; color: #d5b58b; }
    footer { color: #626d7c; font-size: 11px; margin-top: 36px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">SCIENTIA</div>
    <div class="line"></div>
    <h1>The First Fragment</h1>
    <p class="intro">
      Every answer opens a door.<br>
      Examine the fragment carefully.
    </p>

    <div class="clue">
      <img
        id="clueImage"
        src="spage_with_header.jpg"
        alt="The first SCIENTIA clue"
      >
      <div id="placeholder">
        THE FIRST FRAGMENT<br>
        <small>Add your clue image as assets/images/clue1.png</small>
      </div>
    </div>

    <p>Enter the word that unlocks the archive.</p>
    <form id="answerForm">
      <input
        id="answer"
        type="text"
        placeholder="Enter your answer"
        autocomplete="off"
        required
      >
      <button type="submit">Unlock Fragment</button>
    </form>
    <p id="message" role="status"></p>
    <footer>SCIENTIA // ARCHIVE 001</footer>
  </main>

  <script>
    document.getElementById("clueImage").addEventListener("error", function () {
      this.style.display = "none";
      document.getElementById("placeholder").style.display = "block";
    });

    document.getElementById("answerForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const answer = document.getElementById("answer").value.trim();

      if (answer.toLowerCase() === "gabriel") {
        window.location.href = "gate1/";
      } else {
        document.getElementById("message").textContent =
          "Incorrect answer. Examine the fragment again.";
      }
    });
  </script>
</body>
</html>
