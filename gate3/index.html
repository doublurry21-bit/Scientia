
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCIENTIA | المرحلة الانتقالية الثالثة</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: #10131b;
      color: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 680px;
    }

    video {
      display: block;
      width: 100%;
      margin: 24px auto;
      border-radius: 10px;
      background: #000;
    }

    a { color: #9ecbff; }

    p { line-height: 1.8; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: #1b202c;
      color: white;
      border: 1px solid #505a70;
      text-align: center;
      direction: ltr;
    }

    button {
      background: #d5b77a;
      color: #171717;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      min-height: 28px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>SCIENTIA</h1>

    <h2>رائع! لقد تجاوزت المرحلة الثالثة بنجاح.</h2>

    <p>
      بقيت خطوة أخرى قبل الوصول إلى المرحلة الرابعة.
      شاهد الفيديو واستخرج رمز العبور.
    </p>

    <video controls playsinline preload="metadata">
      <source
        src="../snaptik_7518915954336615711_v3~2.mp4"
        type="video/mp4"
      >
      متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <p>
      <a href="../snaptik_7518915954336615711_v3~2.mp4" download>
        تحميل الفيديو
      </a>
    </p>

    <form id="dataForm">
      <label for="data">أدخل البيانات</label>
      <input
        id="data"
        type="text"
        placeholder="Enter access code..."
        autocomplete="off"
        required
      >
      <button type="submit">عبور</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("dataForm");
    const input = document.getElementById("data");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const answer = input.value.trim().normalize("NFC");

      if (answer === "Amélie") {
        message.textContent = "صحيح! تم التحقق من رمز العبور.";

        setTimeout(function() {
          window.location.href = "../stage4.html";
        }, 1000);
      } else {
        message.textContent =
          "البيانات غير صحيحة. أعد مشاهدة الفيديو.";
      }
    });
  </script>
</body>
</html>
