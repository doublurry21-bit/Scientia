<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>PROJECT GENESIS | SCIENTIA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b12;
      color: #e8edf5;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .container {
      width: min(900px, 92%);
      margin: auto;
      padding: 55px 0 70px;
    }

    .eyebrow {
      color: #7896b8;
      font-family: monospace;
      letter-spacing: 4px;
      font-size: 12px;
      direction: ltr;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(30px, 6vw, 48px);
      letter-spacing: 3px;
      direction: ltr;
    }

    .subtitle {
      color: #a3adbd;
      font-size: 14px;
      letter-spacing: 2px;
      direction: ltr;
    }

    .line {
      width: 65px;
      height: 1px;
      background: #7896b8;
      margin: 30px auto;
    }

    .message {
      color: #c5ccd7;
      line-height: 2;
      font-size: 16px;
      margin: 30px auto 38px;
      max-width: 650px;
    }

    .section-title {
      color: #dce5f2;
      font-size: 18px;
      margin: 0 0 18px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 520px;
      background: #000;
      border: 1px solid #263548;
      border-radius: 4px;
    }

    .dossier {
      margin-top: 45px;
      padding: 28px 18px;
      border: 1px solid #263548;
      background: #0c111b;
    }

    .dossier h2 {
      font-size: 20px;
      direction: ltr;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
    }

    .dossier p {
      color: #a3adbd;
      line-height: 1.9;
      font-size: 14px;
    }

    .download {
      display: inline-block;
      margin: 14px 0 8px;
      padding: 12px 22px;
      border: 1px solid #7896b8;
      color: #e8edf5;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      transition: background 0.2s;
    }

    .download:hover {
      background: #182538;
    }

    .pdf-viewer {
      width: 100%;
      height: 650px;
      margin-top: 24px;
      border: 1px solid #263548;
      background: #fff;
    }

    .ending {
      margin-top: 48px;
      color: #8293a8;
      font-size: 13px;
      line-height: 2;
    }

    .end-mark {
      color: #7896b8;
      font-family: monospace;
      letter-spacing: 5px;
      direction: ltr;
      margin-top: 18px;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 38px;
      }

      .pdf-viewer {
        height: 480px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="eyebrow">SCIENTIA — EUREKA SOCIETY</div>

    <h1>PROJECT GENESIS</h1>
    <div class="subtitle">FINAL ARCHIVE — CASE CLOSED</div>

    <div class="line"></div>

    <p class="message">
    <br>
    </p>

    <section>
      <h2 class="section-title">رسالة الختام</h2>
      <video controls playsinline preload="metadata">
        <source src="VID_20260806_200120_838.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>
    </section>

    <section class="dossier">
      <h2>SCIENTIA 741.pdf</h2>

      <p>
        الملف الأخير من الأرشيف.<br>
        افتحه لاكتشاف ما أُعدّ لك في نهاية هذه الرحلة.
      </p>

      <a
        class="download"
        href="SCIENTIA%20741.pdf"
        target="_blank"
        rel="noopener"
      >
        OPEN FINAL DOSSIER
      </a>

      <iframe
        class="pdf-viewer"
        src="SCIENTIA%20741.pdf"
        title="SCIENTIA 741 — Final Dossier"
        loading="lazy"
      ></iframe>
    </section>

    <footer class="ending">
      لقد وصلت إلى النهاية.<br>
      شكرًا لكونك جزءًا من تجربة SCIENTIA.
      <div class="end-mark">END OF TRANSMISSION</div>
    </footer>

  </main>
</body>
</html>
