<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>SCIENTIA | Transition 04</title>

  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #20283a 0, #10131b 58%);
      color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    main { width: 100%; max-width: 720px; }

    .panel {
      background: rgba(24, 29, 42, .96);
      border: 1px solid #39445b;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 55px rgba(0,0,0,.28);
    }

    .eyebrow {
      color: #d5b77a;
      letter-spacing: .16em;
      font-size: .78rem;
      font-weight: 800;
    }

    h1 { margin: 8px 0 4px; font-size: clamp(1.8rem, 6vw, 2.6rem); }
    .sub { color: #aeb8ca; margin-top: 0; }

    video {
      display: block;
      width: 100%;
      max-height: 420px;
      margin: 22px auto;
      border-radius: 12px;
      background: #000;
    }

    h2 {
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      line-height: 1.5;
      text-align: center;
      margin: 24px 0 16px;
    }

    .choices { display: grid; gap: 10px; }

    .choice {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #46516a;
      border-radius: 11px;
      background: #1b2231;
      color: #f2f2f2;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: .15s ease;
    }

    .choice:hover { border-color: #d5b77a; background: #242c3d; }

    .choice[aria-pressed="true"] {
      border-color: #d5b77a;
      background: #302b23;
      box-shadow: inset 0 0 0 1px #d5b77a;
    }

    .letter {
      display: grid;
      place-items: center;
      flex: 0 0 30px;
      height: 30px;
      border-radius: 8px;
      background: #30394c;
      color: #d5b77a;
      font-weight: 800;
    }

    #submit {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #d5b77a;
      color: #171717;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    #submit:disabled { opacity: .45; cursor: not-allowed; }

    #message {
      min-height: 30px;
      margin: 14px 0 0;
      text-align: center;
      line-height: 1.7;
    }

    .success { color: #a8e3b5; }
    .error { color: #ffaaaa; }
    .foot { color: #78849a; text-align: center; font-size: .8rem; margin: 18px 0 0; }

    @media (max-width: 480px) {
      .panel { padding: 18px 14px; }
    }
  </style>
</head>

<body>
  <main>
    <section class="panel">
      <div class="eyebrow">SCIENTIA / PROJECT ZERO</div>
      <h1>TRANSITION 04</h1>
      <p class="sub">One question stands between you and what comes next.</p>

      <video controls playsinline preload="metadata">
        <source src="../snaptik_7666794855309298965_v3.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>

      <h2>Who's the best written character?</h2>

      <div class="choices" id="choices">
        <button class="choice" type="button" data-answer="trap" aria-pressed="false">
          <span class="letter">A</span>
          <span>تراب كينغ</span>
        </button>

        <button class="choice" type="button" data-answer="abdulmajid" aria-pressed="false">
          <span class="letter">B</span>
          <span>ياغامي عبد المجيد</span>
        </button>

        <button class="choice" type="button" data-answer="sisi" aria-pressed="false">
          <span class="letter">C</span>
          <span>السيسي</span>
        </button>

        <button class="choice" type="button" data-answer="tate" aria-pressed="false">
          <span class="letter">D</span>
          <span>أندرو تيت</span>
        </button>
      </div>

      <button id="submit" type="button" disabled>Submit answer</button>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="foot">SCIENTIA · TRANSITION 04</p>
    </section>
  </main>

  <script>
    const choices = [...document.querySelectorAll('.choice')];
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');

    let selected = '';

    choices.forEach(choice => {
      choice.addEventListener('click', () => {
        selected = choice.dataset.answer;

        choices.forEach(item => {
          item.setAttribute(
            'aria-pressed',
            item === choice ? 'true' : 'false'
          );
        });

        submit.disabled = false;
        message.textContent = '';
        message.className = '';
      });
    });

    submit.addEventListener('click', () => {
      if (!selected) return;

      if (selected === 'abdulmajid') {
        message.textContent = 'Correct. You know the answer. Proceeding…';
        message.className = 'success';

        submit.disabled = true;
        choices.forEach(choice => choice.disabled = true);

        setTimeout(() => {
          window.location.href = '../stage5.html';
        }, 1400);
      } else {
        message.textContent = 'Incorrect answer. Think again.';
        message.className = 'error';
      }
    });
  </script>
</body>
</html>
