
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCIENTIA | المرحلة الثالثة</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: #10131b;
      color: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 680px;
    }

    .image-frame {
      margin: 20px auto;
      padding: 8px;
      background: #1b202c;
      border: 1px solid #343b4c;
      border-radius: 12px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    h1 { letter-spacing: 3px; }

    .message {
      direction: ltr;
      font-size: clamp(20px, 5vw, 30px);
      font-weight: bold;
      letter-spacing: 2px;
      overflow-wrap: anywhere;
      margin: 28px 0 18px;
    }

    .hint {
      color: #b9c4d8;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: #1b202c;
      color: white;
      border: 1px solid #505a70;
      text-align: center;
      direction: ltr;
    }

    button {
      margin-top: 12px;
      background: #d5b77a;
      color: #171717;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      min-height: 28px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>SCIENTIA</h1>
    <p>المرحلة الثالثة</p>

    <div class="image-frame">
      <img src="Caesar.jpg" alt="صورة لغز المرحلة الثالثة">
    </div>

    <p class="message">WKH WUXWK LV RXW WKHUH</p>

    <p class="hint">
      Julius knew that three steps could change everything.
    </p>

    <form id="dataForm">
      <label for="data">أدخل البيانات</label>
      <input
        id="data"
        type="text"
        placeholder="Enter decoded data..."
        autocomplete="off"
        required
      >
      <button type="submit">SUBMIT DATA</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("dataForm");
    const input = document.getElementById("data");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const answer = input.value.trim().toUpperCase();

      if (answer === "THE TRUTH IS OUT THERE") {
        message.textContent = "صحيح! لقد اجتزت المرحلة الثالثة.";
        sessionStorage.setItem("scientia_gate3_unlocked", "yes");

        setTimeout(function() {
          window.location.href = "gate3/";
        }, 1000);
      } else {
        message.textContent = "البيانات غير صحيحة. أعد فحص الشيفرة.";
      }
    });
  </script>
</body>
</html>
